<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="utf-8">
	<title>{{ title }}</title>
</head>
<body>
	<h1>{{ title }} ({{ count }})</h1>
	<ul>{{ items }}</ul>
	<form method="post" action="/users">

		<label>E-posta <input name="email" type="email" required></label>
		<button>Ekle</button>
	</form>
	<p><small>Bu sayfa {{ visits }} kez görüntülendi (Redis).</small></p>
</body>
</html>
